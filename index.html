<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>45 días con usted 🩷</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PASSWORD -->
<div id="pantallaPassword" class="pantalla-password">
  <div class="password-box">
    <h1>45 días con usted 🩷</h1>
    <input type="password" id="inputPassword" placeholder="Contraseña">
    <button onclick="verificarPassword()">Entrar</button>
    <p id="errorPassword"></p>
  </div>
</div>

<!-- CONTENIDO -->
<div id="contenidoPrincipal" class="contenido oculto">

  <!-- CONTADORES -->
  <div class="contador-lateral izquierda">
    Nos vemos en<br><span id="contadorEncuentroIzq">--</span> días
  </div>
  <div class="contador-lateral derecha">
    Nos vemos en<br><span id="contadorEncuentroDer">--</span> días
  </div>

  <!-- PORTADA -->
  <section class="portada">
    <h1 class="titulo" id="tituloSecreto">45 días con usted 🩷</h1>

    <div id="bloqueCarta" class="bloque-carta">
      <p id="estadoCarta">Cargando…</p>
      <span id="contadorDesbloqueo"></span>
    </div>
  </section>

  <!-- MENSAJE ESPECIAL -->
  <section id="mensajeEspecial" class="mensaje-especial oculto">
    <p id="textoMensajeEspecial"></p>
  </section>

  <!-- CANCIÓN -->
  <section class="cancion-dia">
    <p>🎵 Canción del día</p>
    <h3 id="tituloCancion"></h3>
    <p id="artistaCancion"></p>
    <a id="linkCancion" target="_blank">Abrir en Spotify</a>
  </section>

  <!-- SELECTOR -->
  <div class="selector-cartas">
    <select id="listaCartas"></select>
  </div>

  <!-- CARTA -->
  <section id="seccionCarta" class="carta-seccion oculto">
    <div class="sobre">
      <div class="tapa"></div>
      <div class="contenido-sobre">
        <p id="contenidoCarta"></p>
      </div>
    </div>
  </section>

  <!-- GALERÍA + VIDEO -->
  <section class="galeria-doble">

    <div class="bloque-fotos">
      <h2>Nuestros momentos ✨</h2>
      <div class="carrusel">
        <button onclick="anterior()">‹</button>
        <img id="imagenCarrusel">
        <button onclick="siguiente()">›</button>
      </div>
    </div>

    <div class="bloque-video">
      <h2>Mensaje del día 💌</h2>
      <p id="textoVideo"></p>
      <video id="videoDiario" controls playsinline></video>
    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
