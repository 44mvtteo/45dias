<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>45 días con usted 💌</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- PANTALLA DE CONTRASEÑA -->
<div id="pantallaPassword" class="pantalla-password">
  <div class="password-box">
    <h2>💌 Ingrese la contraseña 💌</h2>
    <input type="password" id="inputPassword" placeholder="Contraseña">
    <button id="btnEntrar">Entrar</button>
    <div id="errorPassword" style="color:red; margin-top:10px;"></div>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div id="contenidoPrincipal" class="oculto">

  <!-- CARTA DEL DÍA -->
  <div id="bloqueCarta" class="bloque-carta">
    <div id="estadoCarta">Cargando...</div>
    <div id="contadorDesbloqueo"></div>
  </div>

  <!-- SELECTOR DE CARTAS -->
  <select id="listaCartas"></select>

  <!-- CARTA DETALLADA -->
  <div id="seccionCarta" class="carta oculto">
    <div class="numero-dia" id="numeroDia"></div>
    <pre id="contenidoCarta"></pre>
  </div>

  <!-- CONTADOR REENCUENTRO -->
  <div id="contadorViaje" class="contador-final"></div>

  <!-- CARRUSEL -->
  <img id="imagenCarrusel" src="">
  <div class="carrusel">
    <button onclick="anterior()">⬅️</button>
    <button onclick="siguiente()">➡️</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
