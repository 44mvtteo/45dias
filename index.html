<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>45 días con usted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PANTALLA PASSWORD -->
<div id="pantallaPassword" class="pantalla-password">
  <div class="password-box">
    <h1>45 días con usted 🩷</h1>
    <input type="password" id="inputPassword" placeholder="Contraseña">
    <button onclick="verificarPassword()">Entrar</button>
    <p id="errorPassword"></p>
  </div>
</div>

<!-- CONTENIDO -->
<div id="contenido" class="contenido oculto">

  <h1 class="titulo">45 días con usted 🩷</h1>

  <div class="bloque">
    <p id="estadoCarta">Cargando…</p>
    <p id="contadorCarta"></p>
  </div>

  <div class="bloque">
    <h2>Carta del día</h2>
    <p id="textoCarta"></p>
  </div>

  <div class="bloque">
    <h2>Canción del día</h2>
    <p id="tituloCancion"></p>
    <a id="linkCancion" target="_blank">Abrir en Spotify</a>
  </div>

  <div class="bloque">
    <h2>Nos vemos en</h2>
    <p id="contadorEncuentro"></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
