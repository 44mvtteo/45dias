<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>45 días con usted 💌</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- LOGIN -->
<div id="pantallaPassword">
  <input type="password" id="inputPassword" placeholder="Contraseña">
  <button id="btnEntrar">Entrar</button>
  <div id="errorPassword" style="color:red;"></div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div id="contenidoPrincipal" class="oculto">

  <div id="bloqueCarta">
    <div id="estadoCarta"></div>
    <div id="contadorDesbloqueo"></div>
  </div>

  <select id="listaCartas"></select>

  <div id="seccionCarta" class="oculto">
    <h2 id="numeroDia"></h2>
    <pre id="contenidoCarta"></pre>
    <video id="videoDiario" width="100%" controls></video>
  </div>

  <div id="contadorViaje"></div>

  <img id="imagenCarrusel" src="">
  <div class="carrusel">
    <button onclick="anterior()">Anterior</button>
    <button onclick="siguiente()">Siguiente</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
