<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>45 días con usted 💌</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- LOGIN -->
<div id="pantallaPassword" class="pantalla-password">
  <div class="password-box">
    <h2>💌 Ingrese la contraseña 💌</h2>
    <input type="password" id="inputPassword" placeholder="Contraseña">
    <button id="btnEntrar">Entrar</button>
    <div id="errorPassword" class="error"></div>
  </div>
</div>

<!-- APP -->
<div id="contenidoPrincipal" class="oculto app">

  <header class="header">
    <h1>45 días con usted 💌</h1>
  </header>

  <section id="bloqueCarta" class="bloque-carta">
    <div id="estadoCarta"></div>
    <div id="contadorDesbloqueo"></div>
  </section>

  <section class="selector">
    <select id="listaCartas"></select>
  </section>

  <section id="seccionCarta" class="carta oculto">
    <div id="numeroDia" class="numero-dia"></div>
    <pre id="contenidoCarta"></pre>
  </section>

  <section class="carrusel-section">
    <img id="imagenCarrusel" alt="Recuerdo">
    <div class="carrusel">
      <button onclick="anterior()">⬅️</button>
      <button onclick="siguiente()">➡️</button>
    </div>
  </section>

  <footer>
    <div id="contadorViaje" class="contador-final"></div>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
